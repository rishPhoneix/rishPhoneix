name: Generate GitHub Trophies

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Generate trophies
        uses: ryo-ma/github-profile-trophy@master
        with:
          github_user_name: rishPhoneix
          output_path: dist
